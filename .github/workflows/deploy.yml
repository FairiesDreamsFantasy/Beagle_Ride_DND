# [LOCKED] DO NOT MODIFY THIS FILE WITHOUT EXPLICIT ARCHITECTURAL PERMISSION
name: Deploy Beagle Ride DND to Server

on:
  push:
    branches:
      - Stable
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standalone Bundle
        run: npm run build

      - name: Verify Public Standalone Assets
        run: |
          mkdir -p Public/Beagle_Ride_DND/Assets/JS Public/Beagle_Ride_DND/Assets/CSS
          cp -f dist/assets/*.js Public/Beagle_Ride_DND/Assets/JS/index.js || true
          cp -f dist/assets/*.css Public/Beagle_Ride_DND/Assets/CSS/style.css || true

      - name: Commit and Push Built Assets
        run: |
          git config --local user.email "info@fairiesdreamsfantasy.com"
          git config --local user.name "Fairies Dreams Fantasy"
          git add Public/
          git commit -m "Automated build: Sync standalone assets [skip ci]" || echo "No changes to commit"
          git push origin Stable
